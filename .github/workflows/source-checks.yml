name: Source boundary checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-boundaries:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.6'
      - name: Install test runner
        run: python -m pip install pytest==8.4.2 psutil==7.0.0 numpy==2.2.6
      - name: Verify archive safety and required resources
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: >-
          python -B -m pytest
          tests/test_release_bundle.py tests/test_release_ui.py
          tests/test_publication_export.py tests/test_github_staging.py
          tests/test_quest_installer.py tests/test_release_asset_review.py
          tests/test_quest_release_source.py tests/test_host_source_preparation.py
          tests/test_host_compat_candidate.py tests/test_installation_lifecycle.py
          tests/test_host_runtime_candidate.py tests/test_installed_network.py
          tests/test_installer_permissions.py tests/test_quest_build_baseline.py
          tests/test_quest_android_export.py tests/test_quest_dependency_inputs.py
          tests/test_public_host_binding.py
          tests/test_desktop_installation.py tests/test_desktop_backend.py
          tests/test_quest_public_release.py tests/test_host_dependency_sources.py
          tests/test_host_release_inputs.py tests/test_host_release_unpack.py
          tests/test_pairing_host.py
          tests/test_quest_public_ui_build.py
          -q -p no:cacheprovider --basetemp="${{ runner.temp }}/quest3d-source-tests"
      - name: Verify export contents without uploading
        run: python -B scripts/release/export_repository.py --output artifacts/ci-repository
